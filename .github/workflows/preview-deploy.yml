name: Preview Deploy

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: ['feature/**']
  delete:
    branches: ['feature/**']

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm install
        run: npm ci
      - name: build with preview base path
        env:
          BASE_PATH: /workingdiary/preview/${{ github.ref_name }}/
        run: node --import tsx scripts/build.ts
      - name: deploy to gh-pages subfolder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: preview/${{ github.ref_name }}
      - name: comment preview link on PR
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/${branch}/`;
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (prs.length === 0) return;
            const marker = '<!-- workingdiary-preview-link -->';
            const body = `${marker}\n**Preview:** ${previewUrl}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prs[0].number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prs[0].number,
                body,
              });
            }

  cleanup:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    steps:
      - name: checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: remove preview folder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch "preview/${{ github.event.ref }}"
          git commit --allow-empty -m "Remove preview for deleted branch ${{ github.event.ref }}"
          git push
