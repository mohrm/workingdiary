<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54d"/>
      <stop offset="1" stop-color="#f5b300"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a5f"/>
      <stop offset="1" stop-color="#22304a"/>
    </linearGradient>
  </defs>

  <!-- left wing -->
  <g fill="url(#wingGrad)" stroke="#e09e00" stroke-width="6" stroke-linejoin="round">
    <path d="M236 214 C 168 148, 96 128, 34 142 C 78 160, 104 178, 118 198 C 82 198, 54 206, 32 222 C 70 232, 98 244, 116 260 C 92 262, 70 270, 52 284 C 100 292, 148 302, 186 322 C 214 288, 232 254, 236 214 Z"/>
  </g>
  <!-- right wing -->
  <g fill="url(#wingGrad)" stroke="#e09e00" stroke-width="6" stroke-linejoin="round">
    <path d="M276 214 C 344 148, 416 128, 478 142 C 434 160, 408 178, 394 198 C 430 198, 458 206, 480 222 C 442 232, 414 244, 396 260 C 420 262, 442 270, 460 284 C 412 292, 364 302, 326 322 C 298 288, 280 254, 276 214 Z"/>
  </g>

  <!-- crown / button -->
  <rect x="240" y="88" width="32" height="40" rx="10" fill="#3b4a5f"/>
  <rect x="224" y="78" width="64" height="18" rx="9" fill="#f5b300"/>
  <!-- side buttons -->
  <rect x="176" y="176" width="30" height="14" rx="7" fill="#3b4a5f" transform="rotate(-18 191 183)"/>
  <rect x="306" y="176" width="30" height="14" rx="7" fill="#3b4a5f" transform="rotate(18 321 183)"/>

  <!-- watch case -->
  <circle cx="256" cy="300" r="132" fill="url(#bodyGrad)" stroke="#1a2537" stroke-width="10"/>
  <circle cx="256" cy="300" r="106" fill="#f7f9fc"/>

  <!-- ticks -->
  <g stroke="#3b4a5f" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="204" x2="256" y2="222"/>
    <line x1="352" y1="300" x2="334" y2="300"/>
    <line x1="256" y1="396" x2="256" y2="378"/>
    <line x1="160" y1="300" x2="178" y2="300"/>
  </g>
  <g stroke="#9aa7b8" stroke-width="6" stroke-linecap="round">
    <line x1="310" y1="246" x2="300" y2="256"/>
    <line x1="310" y1="354" x2="300" y2="344"/>
    <line x1="202" y1="354" x2="212" y2="344"/>
    <line x1="202" y1="246" x2="212" y2="256"/>
  </g>

  <!-- hands -->
  <line x1="256" y1="300" x2="256" y2="222" stroke="#f5b300" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="300" x2="320" y2="330" stroke="#3b4a5f" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="300" r="14" fill="#f5b300" stroke="#e09e00" stroke-width="4"/>
</svg>
